# OpenArm v2.0 default_bimanual preset, with both stock pinch grippers omitted.
# Source: enactic/openarm_description/assets/robot/openarm_v2.0/config/robot_presets/default_bimanual.yaml
robot:
  root_frame: lift_carriage_link
  components:
    - body
    - primary_arm
    - secondary_arm

body:
  type: robot
  enabled: true
  product: openarm_v2.0
  config: body
  inertials: nominal
  link_name: openarm_body_link0
  connection:
    parent: lift_carriage_link
    # The STEP component origins are CAD file datums, not URDF joint frames.
    # Keep the official body datum here so its arm visuals stay on the adapter.
    origin: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
  reflect: {x: 1, y: 1, z: 1}
  limit_override_joints: {}

primary_arm:
  type: robot
  enabled: true
  product: openarm_v2.0
  config: arm
  inertials: nominal
  prefix: openarm_left_
  connection:
    attach_to: body
    parent_reference_point: left_arm_mount_point
    parent: null
    origin: null
  reflect:
    x: 1
    y: -1
    z: 1
    include:
      links: [base_link, link1, link2, link5, link6, link7]
      joints: [joint1, joint2, joint3, joint5, joint6, joint7]
      reference_points: [ee_mount_point]
  limit_override_joints: {}

secondary_arm:
  type: robot
  enabled: true
  product: openarm_v2.0
  config: arm
  inertials: nominal
  prefix: openarm_right_
  connection:
    attach_to: body
    parent_reference_point: right_arm_mount_point
    parent: null
    origin: null
  reflect: {x: 1, y: 1, z: 1}
  limit_override_joints: {}
